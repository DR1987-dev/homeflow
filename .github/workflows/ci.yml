name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  hcu-plugin:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Determine plugin version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hcu
          platforms: linux/arm64
          load: true
          tags: de/rybosch/david/homeflow:ci
          build-args: |
            PLUGIN_VERSION=${{ steps.version.outputs.value }}
      - name: Verify HCU plugin metadata
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.value }}
        run: |
          metadata="$(docker image inspect de/rybosch/david/homeflow:ci --format '{{ index .Config.Labels "de.eq3.hmip.plugin.metadata" }}')"
          PLUGIN_METADATA="$metadata" node --input-type=module -e '
            const metadata = JSON.parse(process.env.PLUGIN_METADATA ?? "");
            if (metadata.version !== process.env.PLUGIN_VERSION) {
              throw new Error(`Plugin metadata version "${metadata.version}" does not match "${process.env.PLUGIN_VERSION}"`);
            }
          '
      - run: docker save de/rybosch/david/homeflow:ci | gzip > homeflow-hcu-plugin.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: homeflow-hcu-plugin
          path: homeflow-hcu-plugin.tar.gz

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
